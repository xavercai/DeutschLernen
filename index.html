<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>德语课堂 · Deutsch Klasse</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🎙️</text></svg>">
<style>
/* =====================================================================
   style.css · 德语课堂 v2
   简洁、高对比、适合长时间跟读；无框架、无外部字体。
   ===================================================================== */
:root {
  --bg: #0f1115;
  --bg-soft: #161a21;
  --card: #1b2029;
  --card-hi: #202734;
  --line: #2a3240;
  --text: #e8ebf0;
  --muted: #9aa4b2;
  --accent: #4f9cf9;
  --accent-soft: rgba(79, 156, 249, 0.14);
  --green: #3fb96f;
  --orange: #f0a04b;
  --red: #e35d5d;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  font-size: 15px;
  line-height: 1.65;
}

/* ---------- 页头 ---------- */
.app-header {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px 22px;
  background: var(--bg-soft);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
}
.brand { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
.brand small { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 12.5px; }
.date { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
.engine-pill {
  border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; font-size: 13px; cursor: pointer;
  background: var(--card); color: var(--text);
  transition: border-color .15s;
}
.engine-pill:hover { border-color: var(--accent); }
.engine-pill.ok-local { border-color: var(--green); color: var(--green); }
.engine-pill.ok-system { border-color: var(--orange); color: var(--orange); }
.engine-pill.bad { border-color: var(--red); color: var(--red); }
.corpus-stat { color: var(--muted); font-size: 12.5px; }

/* ---------- 标签页 ---------- */
.tabs { display: flex; gap: 8px; padding: 16px 22px 0; }
.tabs button {
  background: transparent; border: none; color: var(--muted);
  font-size: 15px; padding: 8px 16px; cursor: pointer;
  border-bottom: 2px solid transparent;
}
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tabs button:hover { color: var(--text); }

/* ---------- 视图 ---------- */
.view { display: none; padding: 16px 22px 60px; max-width: 980px; margin: 0 auto; }
.view.on { display: block; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 18px;
}
.card:hover { border-color: #33405a; }
.card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.chip {
  font-size: 12px; padding: 2px 10px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent);
}
.chip.level { background: rgba(63, 185, 111, 0.15); color: var(--green); }
.card-idx { color: var(--muted); font-size: 12.5px; margin-left: 4px; }
.btn-master {
  margin-left: auto;
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  border-radius: 999px; padding: 3px 12px; font-size: 12.5px; cursor: pointer;
}
.btn-master.on { border-color: var(--green); color: var(--green); }

/* 德语句子（可点词块） */
.de-line {
  font-size: 21px; line-height: 2.05; margin: 6px 0 4px;
  font-weight: 600; letter-spacing: 0.2px;
}
.de-line .chunk {
  padding: 1px 3px; border-radius: 6px; cursor: pointer;
  transition: background .12s;
}
.de-line .chunk:hover { background: var(--accent-soft); }
.de-line .chunk.hl { background: var(--accent); color: #fff; }
.de-line .chunk.tail { cursor: default; }
.zh-line { color: var(--muted); margin: 0 0 12px; font-size: 14.5px; }

/* 控制区 */
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  background: var(--card-hi); color: var(--text);
  border: 1px solid var(--line); border-radius: 9px;
  padding: 7px 14px; font-size: 14px; cursor: pointer;
  transition: border-color .12s, background .12s;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.accent { border-color: var(--green); color: var(--green); }
.btn.accent:hover { background: rgba(63, 185, 111, 0.12); }
.btn.mini { padding: 3px 10px; font-size: 12.5px; margin-left: 10px; }
.speed-row { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.speed {
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  border-radius: 999px; padding: 3px 12px; font-size: 12.5px; cursor: pointer;
}
.speed.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.play-status {
  margin-top: 10px; font-size: 13.5px; color: var(--accent);
  background: var(--accent-soft); border-radius: 9px; padding: 7px 12px;
}

/* 注释折叠区 */
.notes { margin-top: 14px; display: grid; gap: 8px; }
.note {
  border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg-soft); overflow: hidden;
}
.note summary {
  cursor: pointer; padding: 9px 14px; font-size: 13.5px; color: var(--muted);
  user-select: none; list-style: none;
}
.note summary::-webkit-details-marker { display: none; }
.note summary::before { content: "▸ "; color: var(--accent); }
.note[open] > summary::before { content: "▾ "; }
.note[open] > summary { color: var(--text); border-bottom: 1px solid var(--line); }
.note-body { padding: 10px 14px; }
.note-item { padding: 7px 0; border-bottom: 1px dashed #232b38; }
.note-item:last-child { border-bottom: none; }
.note-h { font-size: 14px; font-weight: 600; }
.note-b { font-size: 13.5px; color: var(--muted); }
.vocab-row { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(160px, 1.2fr) 2fr; gap: 10px; padding: 6px 0; border-bottom: 1px dashed #232b38; font-size: 13.5px; }
.vocab-row:last-child { border-bottom: none; }
.v-de { font-weight: 600; }
.v-pos { color: var(--accent); font-style: normal; font-size: 12px; margin-left: 6px; }
.v-zh { color: var(--muted); }
.v-ex { color: var(--muted); font-size: 12.5px; }
.qa-row { padding: 7px 0; border-bottom: 1px dashed #232b38; font-size: 13.5px; }
.qa-row:last-child { border-bottom: none; }
.qa-q { font-weight: 600; }
.qa-a { color: var(--muted); }

/* ---------- 语料库工具条 ---------- */
.corpus-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.corpus-bar input {
  flex: 1; min-width: 220px;
  background: var(--card); border: 1px solid var(--line); color: var(--text);
  border-radius: 9px; padding: 8px 14px; font-size: 14px; outline: none;
}
.corpus-bar input:focus { border-color: var(--accent); }
.topic-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn {
  background: transparent; border: 1px solid var(--line); color: var(--muted);
  border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer;
}
.chip-btn.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.corpus-count { color: var(--muted); font-size: 12.5px; margin-bottom: 12px; }

/* ---------- 设置 ---------- */
.settings-grid { display: grid; gap: 16px; }
.settings-card {
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px 20px;
}
.settings-card h3 { margin: 0 0 12px; font-size: 15.5px; }
.settings-card h3 small { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 12.5px; }
.radio-row { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 10px; }
.radio-row label { cursor: pointer; font-size: 14px; }
.radio-row input { margin-right: 6px; }
.engine-note { font-size: 13px; color: var(--muted); margin: 2px 0 10px; }
.engine-note.bad { color: var(--red); }
.setting-line { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; font-size: 14px; }
.setting-line select, .setting-line input[type="number"] {
  background: var(--bg-soft); border: 1px solid var(--line); color: var(--text);
  border-radius: 8px; padding: 6px 10px; font-size: 13.5px;
}
.lan-url {
  margin-top: 10px; font-size: 13px; color: var(--muted);
  background: var(--bg-soft); border-radius: 8px; padding: 8px 12px;
  word-break: break-all;
}
.lan-url code { color: var(--green); }

/* ---------- 提示与错误 ---------- */
#toast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px);
  background: #232b3a; color: var(--text);
  border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 20px; font-size: 14px; max-width: 80vw;
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s;
  z-index: 99;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.error { border-color: var(--red); }
#toast.info { border-color: var(--accent); }
.fatal {
  max-width: 720px; margin: 60px auto;
  background: rgba(227, 93, 93, 0.08); border: 1px solid var(--red);
  color: var(--text); border-radius: var(--radius);
  padding: 22px 26px; font-size: 14.5px; line-height: 1.8;
}
.empty { color: var(--muted); text-align: center; padding: 40px 0; }

@media (max-width: 640px) {
  .de-line { font-size: 18px; }
  .vocab-row { grid-template-columns: 1fr; gap: 2px; }
  .view { padding: 12px 14px 60px; }
  .app-header { padding: 12px 14px; }
}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">🎙️ 德语课堂<small>Deutsch Klasse · A1 跟读</small></div>
  <span class="date" id="today-date"></span>
  <span class="spacer"></span>
  <span class="engine-pill" id="engine-pill" title="语音引擎状态">检测语音中…</span>
  <span class="corpus-stat" id="corpus-stat"></span>
</header>

<nav class="tabs">
  <button data-view="daily" class="on">今日跟读</button>
  <button data-view="corpus">语料库</button>
  <button data-view="settings">设置</button>
</nav>

<main>
  <section class="view on" id="view-daily">
    <div id="daily-cards"></div>
  </section>

  <section class="view" id="view-corpus">
    <div class="corpus-bar">
      <input type="search" id="corpus-search" placeholder="搜索：德语 / 中文 / 生词 / 编号，例如 Wetter、打车、fahren">
      <div class="topic-chips" id="topic-chips"></div>
    </div>
    <div class="corpus-count" id="corpus-count"></div>
    <div id="corpus-cards"></div>
  </section>

  <section class="view" id="view-settings">
    <div class="settings-grid">
      <div class="settings-card">
        <h3>语音引擎<small>本地神经语音优先，离线语音包次之，系统德语语音兜底</small></h3>
        <div class="radio-row">
          <label><input type="radio" name="engine" value="auto">自动（推荐：本地优先）</label>
          <label><input type="radio" name="engine" value="local">仅本地神经语音</label>
          <label><input type="radio" name="engine" value="pack">📦 仅离线语音包（静态托管版）</label>
          <label><input type="radio" name="engine" value="system">仅系统语音</label>
        </div>
        <div class="engine-note" id="engine-note-local"></div>
        <div class="engine-note" id="engine-note-pack"></div>
        <div class="setting-line">
          <label for="voice-local">本地声音：</label>
          <select id="voice-local"></select>
        </div>
        <div class="engine-note" id="engine-note-system"></div>
        <div class="setting-line">
          <label for="voice-system">系统声音：</label>
          <select id="voice-system"></select>
        </div>
        <div class="lan-url" id="lan-url" hidden>📱 手机访问（同一 Wi-Fi）：<code></code></div>
      </div>

      <div class="settings-card">
        <h3>跟读循环<small>听一句 → 跟着读一遍，逐遍加速</small></h3>
        <div class="setting-line">
          <label for="shadow-reps">循环遍数（梯度 0.65×→0.95×→1.10×）：</label>
          <select id="shadow-reps">
            <option value="2">2 遍</option>
            <option value="3">3 遍（推荐）</option>
            <option value="4">4 遍</option>
            <option value="5">5 遍</option>
          </select>
        </div>
        <div class="setting-line">
          <label for="shadow-gap">每遍之间留白（秒）：</label>
          <select id="shadow-gap">
            <option value="2">2 秒</option>
            <option value="4">4 秒（推荐）</option>
            <option value="6">6 秒</option>
            <option value="8">8 秒</option>
          </select>
        </div>
      </div>

      <div class="settings-card">
        <h3>学习进度</h3>
        <div class="setting-line" id="progress-info" style="color:var(--muted)"></div>
        <div class="setting-line">
          <button class="btn" id="btn-reset-progress">清空已掌握标记</button>
        </div>
      </div>

      <div class="settings-card">
        <h3>关于本页面</h3>
        <div style="font-size:13px;color:var(--muted);line-height:1.9">
          语料为 105 句 A1 生活/汽车德语，含词块切分、语法注释、发音要点、生词与课堂问答。<br>
          语音：本地 Python 服务（edge-tts，免 API Key）＋ 离线语音包（静态托管版）＋ 系统德语语音兜底。<br>
          数据与进度保存在浏览器 localStorage（键 <code>deutsch-klasse-v2</code>），不上传任何内容。
        </div>
      </div>
    </div>
  </section>
</main>

<div id="toast" role="status"></div>
<div class="fatal" id="fatal" hidden></div>

<script>
/* =====================================================================
   corpus.js · 语料加载与每日抽句
   数据源：data/corpus.json（开发模式 fetch；单文件构建时内联在
   <script id="corpus-data" type="application/json"> 里，两种模式同一套代码）。
   ===================================================================== */

/* ---------- 小工具（全站共用） ---------- */
const DB = {
  KEY: "deutsch-klasse-v2",
  get(k, d) {
    try {
      const all = JSON.parse(localStorage.getItem(this.KEY) || "{}");
      return all[k] !== undefined ? all[k] : d;
    } catch (e) { return d; }
  },
  set(k, v) {
    try {
      const all = JSON.parse(localStorage.getItem(this.KEY) || "{}");
      all[k] = v;
      localStorage.setItem(this.KEY, JSON.stringify(all));
    } catch (e) { /* 隐私模式等场景下静默失败，不影响学习 */ }
  },
  remove(k) {
    try {
      const all = JSON.parse(localStorage.getItem(this.KEY) || "{}");
      delete all[k];
      localStorage.setItem(this.KEY, JSON.stringify(all));
    } catch (e) {}
  },
  resetProgress() { this.set("progress", {}); }
};

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
/* 日期种子 → 确定性伪随机（同一天抽到的句子固定，跨设备一致） */
function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- 语料 ---------- */
const Corpus = {
  doc: null,
  entries: [],
  loaded: false,

  _validate(doc) {
    const problems = [];
    if (!doc || !Array.isArray(doc.entries) || !doc.entries.length) {
      problems.push("corpus.json 缺少非空 entries 数组");
      return problems;
    }
    const seen = new Set();
    for (const e of doc.entries) {
      for (const f of ["id", "topic", "de", "zh", "chunks", "grammar", "pron", "vocab", "qa"]) {
        if (e[f] === undefined) problems.push(`${e.id || "?"} 缺字段 ${f}`);
      }
      if (!e.de || !e.zh) problems.push(`${e.id}: de/zh 为空`);
      if (seen.has(e.id)) problems.push(`${e.id}: id 重复`);
      seen.add(e.id);
      if (!Array.isArray(e.chunks) || !e.chunks.length) problems.push(`${e.id}: chunks 为空`);
      (e.chunks || []).forEach((c, i) => {
        if (!Array.isArray(c) || c.length !== 2) problems.push(`${e.id}: chunks[${i}] 不是二元组`);
      });
    }
    return problems;
  },

  async load() {
    let doc = null;
    const inline = document.getElementById("corpus-data");
    if (inline && inline.textContent.trim()) {
      try { doc = JSON.parse(inline.textContent); }
      catch (e) { throw new Error("内联语料 JSON 解析失败：" + e.message); }
    } else {
      let resp;
      try {
        resp = await fetch("data/corpus.json", { cache: "no-store" });
      } catch (e) {
        throw new Error("无法读取 data/corpus.json（file:// 直接打开时请改用构建后的单文件 deutsch-klasse.html）：" + e.message);
      }
      if (!resp.ok) throw new Error("corpus.json 加载失败：HTTP " + resp.status);
      try { doc = await resp.json(); }
      catch (e) { throw new Error("corpus.json 不是合法 JSON：" + e.message); }
    }
    const problems = this._validate(doc);
    if (problems.length) {
      throw new Error("语料校验未通过：" + problems.slice(0, 5).join("；") +
        (problems.length > 5 ? ` 等 ${problems.length} 处` : ""));
    }
    this.doc = doc;
    this.entries = doc.entries;
    this.loaded = true;
    return this.entries;
  },

  byId(id) { return this.entries.find(e => e.id === id) || null; },
  topics() {
    const t = new Map();
    for (const e of this.entries) t.set(e.topic, (t.get(e.topic) || 0) + 1);
    return t;
  },
  /* 每日固定抽句：生活/汽车交替，池内按日期种子洗牌 */
  daily(count = 4) {
    const rng = mulberry32(hashStr("deutsch-klasse|" + todayKey()));
    const pools = new Map();
    for (const e of this.entries) {
      if (!pools.has(e.topic)) pools.set(e.topic, []);
      pools.get(e.topic).push(e);
    }
    const topicList = shuffle([...pools.keys()], rng);
    const lists = topicList.map(t => shuffle(pools.get(t), rng));
    const out = [];
    let li = 0;
    while (out.length < count) {
      const list = lists[li % lists.length];
      if (!list.length) break;
      out.push(list.pop());
      li++;
    }
    return out;
  },
  search(q, topic) {
    const qq = (q || "").trim().toLowerCase();
    return this.entries.filter(e => {
      if (topic && topic !== "全部" && e.topic !== topic) return false;
      if (!qq) return true;
      if (e.de.toLowerCase().includes(qq)) return true;
      if (e.zh.toLowerCase().includes(qq)) return true;
      if ((e.id || "").toLowerCase().includes(qq)) return true;
      return (e.vocab || []).some(v => (v.de + " " + v.zh).toLowerCase().includes(qq));
    });
  },
  /* 进度（已掌握） */
  masteredMap() { return DB.get("progress", {}) || {}; },
  isMastered(id) { return !!this.masteredMap()[id]; },
  toggleMastered(id) {
    const m = this.masteredMap();
    if (m[id]) delete m[id]; else m[id] = Date.now();
    DB.set("progress", m);
    return !!m[id];
  },
  masteredCount() { return Object.keys(this.masteredMap()).length; }
};
</script>
<script>
/* =====================================================================
   tts.js · 语音引擎
   两个提供方，按优先级自动切换：
     1) Local —— 本地神经语音服务（tts-server.py + edge-tts），
        真实德语神经男/女声，语速 SSML 原生控制，强烈推荐。
     2) Sys   —— 系统 speechSynthesis 德语语音，兜底（需要 Windows
        安装德语语音包；没有德语语音时明确拦截，绝不用英语语音读德语）。
   服务下线/上线都能被页面感知：服务不可用时每 8 秒自动重试探测，
   用户开着页面双击 .bat，状态灯会自动变绿，无需刷新。
   ===================================================================== */

/* 首次点击/触摸后解锁音频（浏览器自动播放策略） */
const AudioGate = {
  unlocked: false,
  unlock() {
    if (this.unlocked) return;
    this.unlocked = true;
    try {
      const a = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=");
      a.volume = 0;
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
      a.onended = () => { a.src = ""; };
    } catch (e) { /* 忽略：后续真实播放时若被拦会给出提示 */ }
  }
};

/* ---------- 提供方 1：本地神经语音服务 ---------- */
const Local = {
  APP_ID: "deutsch-klasse-tts",
  base: null,
  voices: [],
  engineName: "edge-tts",
  lastError: "",
  _cache: new Map(),   // key → objectURL
  _cur: null,          // 当前 <audio>
  _watch: null,

  available() { return !!this.base; },
  voice() {
    const pref = DB.get("voiceLocal", "");
    if (pref && this.voices.some(v => v.id === pref)) return pref;
    return (this.voices[0] && this.voices[0].id) || "de-DE-ConradNeural";
  },
  voiceLabel() {
    const v = this.voices.find(x => x.id === this.voice());
    return v ? v.desc || v.id : this.voice();
  },
  ratePct(rate) {
    return Math.max(-60, Math.min(60, Math.round((rate - 1) * 100)));
  },

  /* 探活：先试页面同源（服务托管的页面），再试回环 8765-8770 */
  async probe() {
    const bases = [];
    if (location.protocol === "http:" && location.hostname) bases.push(location.origin);
    for (let p = 8765; p <= 8770; p++) {
      const b = "http://127.0.0.1:" + p;
      if (!bases.includes(b)) bases.push(b);
    }
    const hits = await Promise.all(bases.map(b => this.ping(b).then(ok => ok ? b : null)));
    const hit = hits.find(Boolean) || null;
    if (hit) {
      this.base = hit;
      this.voices = await this.healthVoices(hit) || [];
      if (!this.voices.length) this.voices = [{ id: "de-DE-ConradNeural", desc: "Conrad · 男" }];
      return true;
    }
    this.base = null;
    return false;
  },

  async ping(b) {
    const ctrl = new AbortController();
    // 2500ms：服务刚启动 / 偶尔网络抖动时，1.2s 会把正常服务误判成没连上
    const timer = setTimeout(() => ctrl.abort(), 2500);
    try {
      const r = await fetch(b + "/api/health", { signal: ctrl.signal, cache: "no-store" });
      if (!r.ok) return false;
      const j = await r.json();
      return !!(j && j.ok && j.app === this.APP_ID);
    } catch (e) { return false; }
    finally { clearTimeout(timer); }
  },

  async healthVoices(b) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 4000);
    try {
      const r = await fetch(b + "/api/health", { signal: ctrl.signal, cache: "no-store" });
      if (!r.ok) return null;
      const j = await r.json();
      return (j && j.ok && j.app === this.APP_ID && Array.isArray(j.voices)) ? j.voices : null;
    } catch (e) { this.lastError = String(e && e.message ? e.message : e); return null; }
    finally { clearTimeout(timer); }
  },

  /* 服务恢复监视：不可用时低频重试，恢复后通知 UI 刷新状态灯。
     静态托管（GitHub Pages）上永远不会成功，所以重试要退避，
     否则每 8 秒一轮（每轮 7 个 origin）会白白耗手机流量和电量。 */
  startWatch() {
    if (this._watch) return;
    let tries = 0;
    const tick = async () => {
      tries++;
      let ok = false;
      try { ok = await this.probe(); } catch (e) { ok = false; }
      if (ok || this.available()) {
        this._watch = null;
        TTS.onEngineChange && TTS.onEngineChange();
        return;
      }
      const delay = tries <= 10 ? 8000 : (tries <= 40 ? 60000 : 300000);
      this._watch = setTimeout(tick, delay);
      if (this._watch.unref) this._watch.unref();
    };
    this._watch = setTimeout(tick, 8000);
    if (this._watch.unref) this._watch.unref();
  },

  async audioUrl(text, rate) {
    const pct = this.ratePct(rate);
    const key = this.voice() + "|" + pct + "|" + text;
    if (this._cache.has(key)) return this._cache.get(key);
    const url = this.base + "/tts?" + new URLSearchParams({
      text, voice: this.voice(), rate: (pct >= 0 ? "+" : "") + pct + "%"
    }).toString();
    const r = await fetch(url, { cache: "force-cache" });
    if (!r.ok) {
      let msg = "本地语音服务返回 HTTP " + r.status;
      try { const j = await r.json(); if (j && j.error) msg = j.error; } catch (e) {}
      throw new Error(msg);
    }
    const blob = await r.blob();
    if (!blob.size) throw new Error("本地语音服务返回了空音频");
    const objectUrl = URL.createObjectURL(blob);
    if (this._cache.size >= 150) {
      const firstKey = this._cache.keys().next().value;
      try { URL.revokeObjectURL(this._cache.get(firstKey)); } catch (e) {}
      this._cache.delete(firstKey);
    }
    this._cache.set(key, objectUrl);
    return objectUrl;
  },

  /* 与 TTS.speak 相同契约；rate 为倍率（0.5=逐词 … 1.1=播报） */
  play(text, rate, opts = {}) {
    return new Promise(async resolve => {
      AudioGate.unlock();
      let url;
      try {
        opts.onStatus && opts.onStatus("正在本地合成…");
        url = await this.audioUrl(text, rate);
        opts.onStatus && opts.onStatus("");
      } catch (e) {
        opts.onError && opts.onError(e);
        opts.onEnd && opts.onEnd();
        return resolve({ done: false, error: e.message });
      }
      this.stop();
      const a = new Audio(url);
      this._cur = a;
      a.onplay = () => { opts.onStart && opts.onStart(); };
      a.onended = () => {
        this._cur = null;
        opts.onEnd && opts.onEnd();
        resolve({ done: true });
      };
      a.onerror = () => {
        this._cur = null;
        const err = new Error("音频播放失败（MP3 解码或自动播放被拦截）");
        opts.onError && opts.onError(err);
        opts.onEnd && opts.onEnd();
        resolve({ done: false, error: err.message });
      };
      try {
        await a.play();
      } catch (e) {
        this._cur = null;
        opts.onError && opts.onError(e);
        opts.onEnd && opts.onEnd();
        resolve({ done: false, error: "自动播放被浏览器拦截，请先点一下页面上的任意播放按钮" });
      }
    });
  },

  stop() {
    const a = this._cur;
    this._cur = null;
    if (a) {
      try { a.pause(); a.onended = null; a.onerror = null; a.onplay = null; } catch (e) {}
    }
  },

  /* 预热：把跟读循环要用的几个语速档先合成好 */
  async prewarm(text, rates) {
    for (const r of rates) { try { await this.audioUrl(text, r); } catch (e) { return; } }
  },

  clearCache() {
    for (const u of this._cache.values()) { try { URL.revokeObjectURL(u); } catch (e) {} }
    this._cache.clear();
  }
};

/* ---------- 提供方 2：系统德语语音（兜底） ---------- */
const MALE_NAMES = ["conrad", "stefan", "klaus", "hans", "markus", "yannick", "jonas", "jan", "michael", "thomas", "andreas", "daniel", "marcel", "lukas", "male", "männlich", "mann"];
const FEMALE_NAMES = ["hedda", "katja", "anna", "petra", "marlene", "vicki", "amala", "maja", "seraphina", "ingrid", "greta", "louisa", "emma", "female", "weiblich", "frau"];

const Sys = {
  voices: [],
  de: [],
  chosen: null,
  _keep: null,
  _seq: 0,

  available() { return !!this.chosen; },

  async scan() {
    const all = await new Promise(res => {
      let v = window.speechSynthesis ? speechSynthesis.getVoices() : [];
      if (v && v.length) return res(v);
      let done = false;
      const fin = () => { if (!done) { done = true; res(speechSynthesis.getVoices() || []); } };
      if (window.speechSynthesis) {
        speechSynthesis.addEventListener("voiceschanged", fin, { once: true });
        setTimeout(fin, 1500);
      } else setTimeout(fin, 50);
    });
    this.voices = all.slice();
    this.de = this.voices.filter(v => /^de/i.test(v.lang || ""));
    this.pickBest();
    return this.de;
  },

  score(v) {
    const n = (v.name || "").toLowerCase(), l = v.lang || "";
    let s = 0;
    if (/^de[-_]de/i.test(l)) s += 100;
    else if (/^de/i.test(l)) s += 60;
    else return -1;
    if (MALE_NAMES.some(m => n.includes(m))) s += 50;
    if (FEMALE_NAMES.some(f => n.includes(f))) s -= 40;
    if (/natural|neural|online|premium/i.test(n)) s += 20;
    if (/local|desktop/i.test(n)) s += 5;
    return s;
  },

  pickBest() {
    const pref = DB.get("voiceSystem", "");
    const byName = this.de.find(v => (v.name || "") === pref);
    if (byName) { this.chosen = byName; return; }
    const cand = this.de.map(v => ({ v, s: this.score(v) }))
      .filter(x => x.s >= 0).sort((a, b) => b.s - a.s);
    this.chosen = cand.length ? cand[0].v : null;
  },

  voiceLabel() { return this.chosen ? `${this.chosen.name}（系统）` : "无"; },

  _stopKeep() { if (this._keep) { clearInterval(this._keep); this._keep = null; } },

  play(text, rate, opts = {}) {
    return new Promise(resolve => {
      if (!this.chosen) {
        const err = new Error("系统里没有德语语音");
        opts.onError && opts.onError(err);
        opts.onEnd && opts.onEnd();
        return resolve({ done: false, error: err.message });
      }
      const seq = ++this._seq;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = this.chosen.lang || "de-DE";
      u.voice = this.chosen;
      u.rate = Math.max(0.1, Math.min(2, rate));
      u.pitch = 1;
      u.volume = 1;
      u.onstart = () => { if (seq === this._seq) opts.onStart && opts.onStart(); };
      u.onboundary = e => { if (seq === this._seq && opts.onWord && typeof e.charIndex === "number") opts.onWord(e.charIndex); };
      u.onend = () => { if (seq === this._seq) { this._stopKeep(); opts.onEnd && opts.onEnd(); resolve({ done: true }); } };
      u.onerror = () => { if (seq === this._seq) { this._stopKeep(); opts.onEnd && opts.onEnd(); resolve({ done: false }); } };
      /* Chrome 长句约 15 秒会被中止，用 pause/resume 兜住 */
      this._stopKeep();
      this._keep = setInterval(() => {
        if (!speechSynthesis.speaking) return;
        speechSynthesis.pause();
        speechSynthesis.resume();
      }, 9000);
      speechSynthesis.speak(u);
    });
  },

  stop() {
    this._seq++;
    this._stopKeep();
    try { speechSynthesis.cancel(); } catch (e) {}
  }
};

/* ---------- 提供方 3：离线语音包（静态托管 / GitHub Pages） ----------
   页面同源读取 audio.json 清单 + audio/*.mp3，由 scripts/build_audio.py 用
   edge-tts 预合成（整句按 5 档语速各一份，词块一份）。
   清单不存在时静默不可用，不影响本地/系统两条路。                       */
const Pack = {
  MANIFEST: "audio.json",
  map: null,
  _loaded: false,
  _cur: null,
  lastError: "",

  async load() {
    if (this._loaded) return this.available();
    this._loaded = true;
    try {
      const r = await fetch(this.MANIFEST, { cache: "no-cache" });
      if (!r.ok) return false;
      const j = await r.json();
      if (j && typeof j === "object" && Object.keys(j).length) { this.map = j; return true; }
    } catch (e) { /* 没有清单就是没有离线包，静默降级 */ }
    return false;
  },

  available() { return !!(this.map && Object.keys(this.map).length); },
  count() { return this.map ? Object.keys(this.map).length : 0; },
  has(text) { return !!(this.map && text && this.map[text]); },
  voiceLabel() { return this.count() + " 条离线音频"; },

  /* 记录形如 {"-5":"audio/xx.mp3"}；挑与目标语速最接近的一档，
     差值用 playbackRate 补偿（词块只有一档时走这条）。 */
  _pick(rec, rate) {
    let bestK = null, bestU = null, bd = Infinity;
    for (const k in rec) {
      const r = 1 + (parseInt(k, 10) || 0) / 100;
      const d = Math.abs(r - rate);
      if (d < bd) { bd = d; bestK = k; bestU = rec[k]; }
    }
    if (bestU == null) return null;
    const base = 1 + (parseInt(bestK, 10) || 0) / 100;
    return { url: bestU, pb: base > 0 ? Math.max(0.1, Math.min(4, rate / base)) : 1 };
  },

  play(text, rate, opts = {}) {
    return new Promise(async resolve => {
      const rec = this.map ? this.map[text] : null;
      if (!rec) {
        const e = new Error("离线语音包里没有这一条");
        opts.onError && opts.onError(e); opts.onEnd && opts.onEnd();
        return resolve({ done: false, error: e.message });
      }
      const picked = this._pick(rec, Math.max(0.1, Math.min(2, rate || 0.95)));
      if (!picked) {
        const e = new Error("离线语音包条目损坏");
        opts.onError && opts.onError(e); opts.onEnd && opts.onEnd();
        return resolve({ done: false, error: e.message });
      }
      AudioGate.unlock();
      this.stop();
      const a = new Audio();
      this._cur = a;
      const applyRate = () => {
        try { a.playbackRate = picked.pb; a.preservesPitch = true; } catch (e) {}
      };
      a.onloadedmetadata = applyRate;
      a.onplay = () => { applyRate(); opts.onStart && opts.onStart(); };
      a.onended = () => { this._cur = null; opts.onEnd && opts.onEnd(); resolve({ done: true }); };
      a.onerror = () => {
        this._cur = null;
        const e = new Error("离线音频播放失败");
        opts.onError && opts.onError(e); opts.onEnd && opts.onEnd();
        resolve({ done: false, error: e.message });
      };
      try {
        // 必须在用户手势内同步设置 src 并调 play()，iOS 才肯播
        a.src = picked.url;
        await a.play();
        applyRate();
        this.lastError = "";
      } catch (e1) {
        // 兜底：某些静态托管把 .mp3 标成非标准 audio/mp3，iOS 会拒播 → 取回后重建 blob
        try {
          const r = await fetch(picked.url, { cache: "force-cache" });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const blob = await r.blob();
          a.src = URL.createObjectURL(new Blob([blob], { type: "audio/mpeg" }));
          await a.play();
          applyRate();
          this.lastError = "已用 blob 兜底播放成功（原 MIME 可能不对）";
        } catch (e2) {
          this._cur = null;
          const msg = String((e2 && e2.name ? e2.name + ": " : "") + (e2 && e2.message || e2));
          this.lastError = msg;
          opts.onError && opts.onError(new Error(msg));
          opts.onEnd && opts.onEnd();
          resolve({ done: false, error: msg });
        }
      }
    });
  },

  stop() {
    const a = this._cur; this._cur = null;
    if (a) {
      try { a.pause(); a.onended = null; a.onerror = null; a.onplay = null; a.onloadedmetadata = null; } catch (e) {}
    }
  }
};

/* ---------- 引擎门面 ---------- */
const TTS = {
  onEngineChange: null,
  onError: null,
  init: null,   // 由 app.js 挂上状态刷新回调

  pref() { return DB.get("engine", "auto"); },

  /* 按当前偏好返回生效的提供方（auto=本地优先，否则系统兜底） */
  active() {
    const pref = this.pref();
    if (pref === "local") return Local.available() ? Local : null;
    if (pref === "system") return Sys.available() ? Sys : null;
    if (pref === "pack") return Pack.available() ? Pack : null;
    if (Local.available()) return Local;
    if (Pack.available()) return Pack;
    if (Sys.available()) return Sys;
    return null;
  },

  /* 状态描述，供 UI 状态灯/设置页使用 */
  status() {
    const p = this.active();
    if (p === Local) return { ok: true, kind: "local", label: "本地神经语音 · " + Local.voiceLabel() };
    if (p === Pack) return { ok: true, kind: "pack", label: "离线语音包 · " + Pack.voiceLabel() };
    if (p === Sys) return { ok: true, kind: "system", label: "系统德语语音 · " + Sys.voiceLabel() };
    const reasons = [];
    if (this.pref() !== "system" && !Local.available()) reasons.push("本地服务未连接（运行「启动德语课堂.bat」）");
    if (this.pref() !== "pack" && !Pack.available()) reasons.push("没有离线语音包（静态托管版需要 audio.json）");
    if (this.pref() !== "local" && !Sys.available()) reasons.push("系统未安装德语语音");
    return { ok: false, kind: "none", label: "没有可用的德语语音", reason: reasons.join("；") };
  },

  /* 朗读一段文字。rate 为倍率；opts: onStatus/onStart/onEnd/onError/onWord */
  speak(text, rate, opts = {}) {
    const p = this.active();
    if (!p) {
      const st = this.status();
      opts.onBlocked && opts.onBlocked(st);
      this.onError && this.onError(new Error(st.reason || st.label));
      return Promise.resolve({ done: false, blocked: true });
    }
    return p.play(text, rate, opts);
  },

  stop() { Local.stop(); Pack.stop(); Sys.stop(); },

  /* 引擎可用性变化（探测成功/系统语音加载完成）时由 app.js 调用 */
  refreshStatus() { this.onEngineChange && TTS.onEngineChange(); }
};
</script>
<script>
/* =====================================================================
   shadow.js · 跟读工作流
   - 五档真实语速：逐词 0.50× / 很慢 0.65× / 慢速 0.80× / 常速 0.95× / 播报 1.10×
     （本地服务用 SSML prosody 原生变速，系统语音用 utterance.rate）
   - 词块朗读：按 chunks 逐块播放，块间停顿，高亮当前块
   - 跟读循环：按「很慢→慢速→常速→播报」梯度跑 N 遍，每遍之间留
     跟读时间（倒计时，可提前进入下一遍）
   一切播放都经过 TTS 门面；取消用 token.cancelled 标记，旧播放回调
   检测到新 token 后自动失效。
   ===================================================================== */

const SPEEDS = [
  { k: "word",   label: "逐词", sub: "0.50×", rate: 0.50 },
  { k: "vslow",  label: "很慢", sub: "0.65×", rate: 0.65 },
  { k: "slow",   label: "慢速", sub: "0.80×", rate: 0.80 },
  { k: "normal", label: "常速", sub: "0.95×", rate: 0.95 },
  { k: "fast",   label: "播报", sub: "1.10×", rate: 1.10 }
];
function speedBy(k) { return SPEEDS.find(s => s.k === k) || SPEEDS[3]; }

const Shadow = {
  _token: null,
  get running() { return !!this._token && !this._token.cancelled; },

  _newRun() {
    this.stop();
    return (this._token = { cancelled: false });
  },

  stop() {
    if (this._token) this._token.cancelled = true;
    TTS.stop();
  },

  /* 整句播放（用于卡片主播放按钮，speedKey 为 SPEEDS 的 k） */
  playSentence(item, speedKey, hooks = {}) {
    const sp = speedBy(speedKey || "normal");
    const tok = this._newRun();
    hooks.onState && hooks.onState({ phase: "listen", speed: sp, round: 0, countdown: 0 });
    return TTS.speak(item.de, sp.rate, {
      onStatus: s => hooks.onState && hooks.onState({ phase: "synth", speed: sp, text: s }),
      onStart: () => { if (!tok.cancelled) hooks.onState && hooks.onState({ phase: "listen", speed: sp, round: 0, countdown: 0 }); },
      onEnd: () => { if (!tok.cancelled) hooks.onState && hooks.onState({ phase: "idle" }); },
      onError: e => { if (!tok.cancelled) hooks.onError && hooks.onError(e); },
      onBlocked: st => { if (!tok.cancelled) hooks.onBlocked && hooks.onBlocked(st); }
    });
  },

  /* 播放一个词块（点击句子中的任意块） */
  playChunk(item, chunkIndex, speedKey, hooks = {}) {
    const chunks = item.chunks || [];
    const c = chunks[chunkIndex];
    if (!c || !c[0]) return Promise.resolve({ done: false });
    const sp = speedBy(speedKey || "normal");
    const tok = this._newRun();
    hooks.onChunk && hooks.onChunk(chunkIndex);
    return TTS.speak(c[0], sp.rate, {
      onError: e => { if (!tok.cancelled) hooks.onError && hooks.onError(e); },
      onBlocked: st => { if (!tok.cancelled) hooks.onBlocked && hooks.onBlocked(st); }
    }).then(r => {
      if (!tok.cancelled) hooks.onChunkEnd && hooks.onChunkEnd(chunkIndex);
      return r;
    });
  },

  /* 词块朗读：逐块播放 + 块间停顿 + 高亮 */
  async playChunks(item, hooks = {}) {
    const tok = this._newRun();
    const chunks = item.chunks || [];
    for (let i = 0; i < chunks.length; i++) {
      if (tok.cancelled) return;
      hooks.onState && hooks.onState({ phase: "listen", chunk: i, round: 0, countdown: 0 });
      hooks.onChunk && hooks.onChunk(i);
      await TTS.speak(chunks[i][0], 0.95, {
        onError: e => { if (!tok.cancelled) hooks.onError && hooks.onError(e); },
        onBlocked: st => { if (!tok.cancelled) hooks.onBlocked && hooks.onBlocked(st); return; }
      });
      if (tok.cancelled) return;
      hooks.onChunkEnd && hooks.onChunkEnd(i);
      if (i < chunks.length - 1) await sleep(380);
    }
    if (!tok.cancelled) hooks.onState && hooks.onState({ phase: "idle" });
  },

  /* 跟读循环：梯度语速跑 reps 遍，遍间 gapSec 秒跟读时间（倒计时可跳过） */
  async shadowLoop(item, hooks = {}) {
    const reps = Math.max(1, Math.min(5, hooks.reps || 3));
    const gapSec = Math.max(2, Math.min(10, hooks.gapSec || 4));
    const ladder = [0.65, 0.80, 0.95, 1.10];
    const tok = this._newRun();
    if (Local.available()) {
      Local.prewarm(item.de, ladder.slice(0, reps));
    }
    for (let r = 1; r <= reps; r++) {
      if (tok.cancelled) return;
      const rate = ladder[Math.min(r - 1, ladder.length - 1)];
      const sp = SPEEDS.find(s => Math.abs(s.rate - rate) < 0.001) || SPEEDS[3];
      hooks.onState && hooks.onState({ phase: "listen", round: r, reps, speed: sp, countdown: 0 });
      await TTS.speak(item.de, rate, {
        onStatus: s => { if (!tok.cancelled) hooks.onState && hooks.onState({ phase: "synth", round: r, reps, text: s }); },
        onStart: () => { if (!tok.cancelled) hooks.onState && hooks.onState({ phase: "listen", round: r, reps, speed: sp, countdown: 0 }); },
        onError: e => { if (!tok.cancelled) hooks.onError && hooks.onError(e); }
      });
      if (tok.cancelled) return;
      if (r < reps) {
        const skip = await this._countdown(gapSec, tok, r, reps, hooks);
        if (tok.cancelled) return;
        if (skip) continue;
      }
    }
    if (!tok.cancelled) hooks.onState && hooks.onState({ phase: "idle" });
  },

  /* 跟读倒计时；返回 true 表示用户点了「下一遍」跳过剩余等待 */
  _countdown(sec, tok, round, reps, hooks) {
    return new Promise(resolve => {
      let left = sec;
      hooks.onState && hooks.onState({ phase: "shadow", round, reps, countdown: left });
      const iv = setInterval(() => {
        if (tok.cancelled) { clearInterval(iv); resolve(true); return; }
        left--;
        if (left <= 0) {
          clearInterval(iv);
          hooks.onState && hooks.onState({ phase: "listen", round: round + 1, reps, countdown: 0 });
          resolve(false);
        } else {
          hooks.onState && hooks.onState({ phase: "shadow", round, reps, countdown: left });
        }
      }, 1000);
      this._countdownSkip = () => { clearInterval(iv); resolve(true); };
    });
  },
  skipCountdown() { if (this._countdownSkip) { const f = this._countdownSkip; this._countdownSkip = null; f(); } }
};
</script>
<script>
/* =====================================================================
   ui.js · 视图与卡片渲染
   三个视图：今日跟读 / 语料库 / 设置。
   句子按 chunks 切分成可点击的词块（点击=试听该词块）；
   注释（语法/发音/词汇/问答/词块对照）用原生 <details> 折叠，
   折叠逻辑不依赖 JS，天然健壮。
   ===================================================================== */

const UI = {
  els: {},
  dailyItems: [],
  corpusTopic: "全部",
  corpusQuery: "",

  init() {
    const g = id => document.getElementById(id);
    this.els = {
      fatal: g("fatal"),
      date: g("today-date"),
      pill: g("engine-pill"),
      dailyCards: g("daily-cards"),
      corpusCards: g("corpus-cards"),
      corpusSearch: g("corpus-search"),
      corpusCount: g("corpus-count"),
      topicChips: g("topic-chips"),
      toast: g("toast"),
      viewTitles: document.querySelectorAll(".tabs [data-view]"),
      // 设置页
      engineRadios: document.querySelectorAll("input[name='engine']"),
      engineNoteLocal: g("engine-note-local"),
      engineNotePack: g("engine-note-pack"),
      engineNoteSystem: g("engine-note-system"),
      voiceLocalSel: g("voice-local"),
      voiceSystemSel: g("voice-system"),
      repsSel: g("shadow-reps"),
      gapSel: g("shadow-gap"),
      progressInfo: g("progress-info"),
      btnReset: g("btn-reset-progress"),
      lanUrl: g("lan-url"),
    };
  },

  /* ---------- 通用 ---------- */
  esc: esc,

  toast(msg, kind) {
    const el = this.els.toast;
    el.textContent = msg;
    el.className = "show " + (kind || "info");
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => { el.className = ""; }, 4200);
  },

  updateStatus() {
    const st = TTS.status();
    const pill = this.els.pill;
    pill.textContent = (st.ok ? (st.kind === "local" ? "🎙️ " : (st.kind === "pack" ? "📦 " : "🖥️ ")) : "⚠️ ") + st.label;
    pill.className = "engine-pill " + (st.ok ? (st.kind === "local" ? "ok-local" : "ok-system") : "bad");
    pill.title = st.ok ? "语音引擎正常，点我打开设置" : (st.reason || "点我打开设置");
  },

  /* 句子 → 词块 span 列表：以 item.de 为准切分，chunks 只提供块边界与中文释义 */
  chunkSpans(item) {
    const de = String(item.de || "");
    const chunks = Array.isArray(item.chunks) && item.chunks.length ? item.chunks : null;
    if (!chunks) return [{ de, zh: "", i: -1 }];
    const tokens = de.match(/\S+\s*|\s+/g) || [de];
    const wordRe = /^[A-Za-zÄÖÜäöüß0-9]/;
    const spans = [];
    let t = 0, ci = 0;
    for (const c of chunks) {
      const need = String(c[0] || "").trim().split(/\s+/).filter(Boolean).length || 1;
      let got = 0, buf = "";
      while (t < tokens.length && got < need) {
        buf += tokens[t];
        if (wordRe.test(tokens[t].trimStart())) got++;
        t++;
      }
      spans.push({ de: buf, zh: String(c[1] || ""), i: ci });
      ci++;
    }
    if (t < tokens.length) spans.push({ de: tokens.slice(t).join(""), zh: "", i: -1 });
    return spans;
  },

  /* ---------- 卡片 ---------- */
  cardHTML(item, idx, total) {
    const spans = this.chunkSpans(item);
    const mastered = Corpus.isMastered(item.id);
    const deLine = spans.map(s =>
      s.i >= 0
        ? `<span class="chunk" data-chunk="${s.i}" title="${esc(s.zh)}">${esc(s.de)}</span>`
        : `<span class="chunk tail">${esc(s.de)}</span>`
    ).join("");

    const zhLine = esc(item.zh);

    const notes = [];
    if ((item.grammar || []).length) notes.push(this._noteBlock("grammar", "📘 A1 语法注释", item.grammar, true));
    if ((item.chunks || []).length) notes.push(this._noteBlock("chunks", "🧩 词块对照", item.chunks.map(c => ({ h: c[0], b: esc(c[1]) })), false));
    if ((item.pron || []).length) notes.push(this._noteBlock("pron", "🔊 发音要点", item.pron, false));
    if ((item.vocab || []).length) notes.push(this._vocabBlock(item.vocab));
    if ((item.qa || []).length) notes.push(this._qaBlock(item.qa));

    return `
    <article class="card" data-id="${esc(item.id)}" id="card-${esc(item.id)}">
      <header class="card-top">
        <span class="chip topic">${esc(item.topic)}</span>
        <span class="chip level">A1</span>
        <span class="card-idx">${idx}${total ? " / " + total : ""}</span>
        <button class="btn-master ${mastered ? "on" : ""}" title="标记为已掌握">${mastered ? "✓ 已掌握" : "○ 标记掌握"}</button>
      </header>
      <p class="de-line">${deLine}</p>
      <p class="zh-line">${zhLine}</p>
      <div class="card-controls">
        <div class="btn-row">
          <button class="btn primary btn-play">▶ 常速</button>
          <button class="btn btn-chunks">🧩 词块朗读</button>
          <button class="btn accent btn-loop">🔁 跟读循环</button>
          <button class="btn btn-stop" hidden>■ 停止</button>
        </div>
        <div class="speed-row">
          ${SPEEDS.map(s => `<button class="speed ${s.k === "normal" ? "on" : ""}" data-speed="${s.k}" title="${s.sub}">${s.label}</button>`).join("")}
        </div>
        <div class="play-status" hidden></div>
      </div>
      <div class="notes">${notes.join("")}</div>
    </article>`;
  },

  _noteBlock(key, title, items, open) {
    const body = items.map(g =>
      `<div class="note-item"><div class="note-h">${esc(g.h)}</div><div class="note-b">${g.b}</div></div>`
    ).join("");
    return `<details class="note" ${open ? "open" : ""}><summary>${title} · ${items.length}</summary><div class="note-body">${body}</div></details>`;
  },

  _vocabBlock(vocab) {
    const rows = vocab.map(v =>
      `<div class="vocab-row"><span class="v-de">${esc(v.de)}${v.pos ? `<em class="v-pos">${esc(v.pos)}</em>` : ""}</span><span class="v-zh">${esc(v.zh)}</span>${v.ex ? `<span class="v-ex">${esc(v.ex)}</span>` : ""}</div>`
    ).join("");
    return `<details class="note"><summary>📖 生词 · ${vocab.length}</summary><div class="note-body">${rows}</div></details>`;
  },

  _qaBlock(qa) {
    const rows = qa.map(q =>
      `<div class="qa-row"><div class="qa-q">Q：${esc(q.q)}</div><div class="qa-a">A：${esc(q.a)}</div></div>`
    ).join("");
    return `<details class="note"><summary>💬 课堂问答 · ${qa.length}</summary><div class="note-body">${rows}</div></details>`;
  },

  /* 卡片内当前语速选择（每张卡片独立） */
  _cardSpeed(cardEl) {
    const on = cardEl.querySelector(".speed.on");
    return on ? on.dataset.speed : "normal";
  },

  _setPlayStatus(cardEl, html) {
    const el = cardEl.querySelector(".play-status");
    if (!el) return;
    if (html) { el.hidden = false; el.innerHTML = html; }
    else { el.hidden = true; el.innerHTML = ""; }
  },

  _setLoopUI(cardEl, active) {
    cardEl.querySelector(".btn-loop").hidden = active;
    cardEl.querySelector(".btn-stop").hidden = !active;
  },

  /* 绑定一张卡片的所有交互 */
  wireCard(cardEl) {
    const item = Corpus.byId(cardEl.dataset.id);
    if (!item) return;
    const self = this;

    // 语速切换
    cardEl.querySelectorAll(".speed").forEach(btn => {
      btn.addEventListener("click", () => {
        cardEl.querySelectorAll(".speed").forEach(b => b.classList.remove("on"));
        btn.classList.add("on");
        const sp = speedBy(btn.dataset.speed);
        cardEl.querySelector(".btn-play").textContent = "▶ " + sp.label;
      });
    });

    // 整句播放
    cardEl.querySelector(".btn-play").addEventListener("click", () => {
      Shadow.playSentence(item, this._cardSpeed(cardEl), {
        onState: st => this._playState(cardEl, st),
        onError: e => self.toast("语音播放失败：" + e.message, "error"),
        onBlocked: st => self.toast("没有可用的德语语音。" + (st.reason ? "（" + st.reason + "）" : ""), "error")
      });
    });

    // 词块朗读
    cardEl.querySelector(".btn-chunks").addEventListener("click", () => {
      Shadow.playChunks(item, {
        onState: st => this._playState(cardEl, st),
        onChunk: i => this._hlChunk(cardEl, i),
        onChunkEnd: () => this._hlChunk(cardEl, -1),
        onError: e => self.toast("语音播放失败：" + e.message, "error"),
        onBlocked: st => self.toast("没有可用的德语语音。" + (st.reason ? "（" + st.reason + "）" : ""), "error")
      });
    });

    // 点击句子中的任意词块 → 试听该块
    cardEl.querySelectorAll(".chunk[data-chunk]").forEach(span => {
      span.addEventListener("click", () => {
        const i = +span.dataset.chunk;
        this._hlChunk(cardEl, i);
        Shadow.playChunk(item, i, this._cardSpeed(cardEl), {
          onChunk: idx => this._hlChunk(cardEl, idx),
          onChunkEnd: () => this._hlChunk(cardEl, -1),
          onError: e => self.toast("语音播放失败：" + e.message, "error"),
          onBlocked: st => self.toast("没有可用的德语语音。" + (st.reason ? "（" + st.reason + "）" : ""), "error")
        });
      });
    });

    // 跟读循环
    const loopBtn = cardEl.querySelector(".btn-loop");
    loopBtn.addEventListener("click", () => {
      // 遍数/留白在点击时现读：设置页改了参数后不用刷新页面就生效
      const reps = DB.get("shadowReps", 3);
      const gapSec = DB.get("shadowGap", 4);
      loopBtn.textContent = `🔁 跟读循环 ×${reps}`;
      this._setLoopUI(cardEl, true);
      Shadow.shadowLoop(item, {
        reps, gapSec,
        onState: st => this._playState(cardEl, st),
        onError: e => self.toast("跟读循环出错：" + e.message, "error")
      }).then(() => self._setLoopUI(cardEl, false));
    });

    cardEl.querySelector(".btn-stop").addEventListener("click", () => {
      Shadow.stop();
      self._setLoopUI(cardEl, false);
      self._playState(cardEl, { phase: "idle" });
      self._hlChunk(cardEl, -1);
    });

    // 掌握标记
    cardEl.querySelector(".btn-master").addEventListener("click", () => {
      const on = Corpus.toggleMastered(item.id);
      const b = cardEl.querySelector(".btn-master");
      b.classList.toggle("on", on);
      b.textContent = on ? "✓ 已掌握" : "○ 标记掌握";
      self.els.progressInfo && (self.els.progressInfo.textContent = `已掌握 ${Corpus.masteredCount()} / ${Corpus.entries.length}`);
    });
  },

  _hlChunk(cardEl, i) {
    cardEl.querySelectorAll(".chunk").forEach(c => c.classList.remove("hl"));
    if (i >= 0) {
      const c = cardEl.querySelector(`.chunk[data-chunk="${i}"]`);
      if (c) { c.classList.add("hl"); c.scrollIntoView({ block: "nearest" }); }
    }
  },

  /* 播放状态行（跟读循环的阶段展示） */
  _playState(cardEl, st) {
    if (st.phase === "idle") return this._setPlayStatus(cardEl, "");
    if (st.phase === "synth") {
      this._setPlayStatus(cardEl, `⏳ ${esc(st.text || "合成中")}…`);
      return;
    }
    if (st.phase === "listen") {
      let html;
      if (st.chunk !== undefined) {
        html = `🔊 词块 ${st.chunk + 1} 朗读中`;
      } else if (st.reps) {
        html = `🔊 第 ${st.round}/${st.reps} 遍 · ${st.speed ? st.speed.label + " " + st.speed.sub : ""} · 听`;
      } else {
        html = st.speed ? `🔊 ${st.speed.label} ${st.speed.sub} 播放中` : "🔊 播放中";
      }
      this._setPlayStatus(cardEl, html);
      return;
    }
    if (st.phase === "shadow") {
      this._setPlayStatus(cardEl, `🗣️ 第 ${st.round}/${st.reps} 遍 · 轮到你了，请跟读（${st.countdown}s 后自动下一遍）
        <button class="btn mini btn-skip" type="button">下一遍 ➜</button>`);
      const skipBtn = cardEl.querySelector(".btn-skip");
      if (skipBtn) skipBtn.onclick = () => Shadow.skipCountdown();
    }
  },

  /* ---------- 视图 ---------- */
  showView(name) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
    document.getElementById("view-" + name).classList.add("on");
    this.els.viewTitles.forEach(b => b.classList.toggle("on", b.dataset.view === name));
    if (name === "settings") this.renderSettings();
  },

  renderDaily() {
    this.dailyItems = Corpus.daily(4);
    this.els.dailyCards.innerHTML = this.dailyItems.map((it, i) => this.cardHTML(it, i + 1, this.dailyItems.length)).join("");
    this.els.dailyCards.querySelectorAll(".card").forEach(c => this.wireCard(c));
  },

  renderCorpus() {
    const items = Corpus.search(this.corpusQuery, this.corpusTopic);
    this.els.corpusCount.textContent = `${items.length} / ${Corpus.entries.length} 句 · 已掌握 ${Corpus.masteredCount()}`;
    this.els.corpusCards.innerHTML = items.length
      ? items.map((it, i) => this.cardHTML(it, i + 1, items.length)).join("")
      : `<div class="empty">没有匹配的句子。换个关键词试试（支持德语、中文、生词、编号）。</div>`;
    this.els.corpusCards.querySelectorAll(".card").forEach(c => this.wireCard(c));
  },

  renderSettings() {
    const self = this;
    // 引擎单选
    this.els.engineRadios.forEach(r => {
      r.checked = r.value === TTS.pref();
      // 用 onchange 赋值而不是 addEventListener：否则每开一次设置页就多挂一个监听器
      r.onchange = () => {
        DB.set("engine", r.value);
        TTS.refreshStatus();
        self.renderSettings();
      };
    });
    this.els.engineNoteLocal.textContent = Local.available()
      ? `已连接：${Local.base} · 缓存 ${Local._cache.size} 段`
      : "未连接 —— 双击「启动德语课堂.bat」启动（页面会自动探测，无需刷新）";
    this.els.engineNoteSystem.textContent = Sys.available()
      ? `已找到：${Sys.voiceLabel()}`
      : "系统未安装德语语音（Windows 设置 → 时间和语言 → 语音 → 添加 de-DE 语音包）";
    this.els.engineNotePack.textContent = Pack.available()
      ? `已就绪：${Pack.count()} 条离线音频（静态托管版，手机上不依赖电脑）`
      : "没有离线语音包（缺 audio.json）。本地版不需要它；GitHub Pages 版要先跑一次 Action 生成。";

    // 声音选择
    this.els.voiceLocalSel.innerHTML = Local.voices.length
      ? Local.voices.map(v => `<option value="${esc(v.id)}" ${v.id === Local.voice() ? "selected" : ""}>${esc(v.desc || v.id)}</option>`).join("")
      : `<option>（服务未连接）</option>`;
    this.els.voiceLocalSel.disabled = !Local.available();
    this.els.voiceLocalSel.onchange = () => { DB.set("voiceLocal", this.els.voiceLocalSel.value); TTS.refreshStatus(); };

    const sysPref = DB.get("voiceSystem", "");
    this.els.voiceSystemSel.innerHTML = Sys.de.length
      ? Sys.de.map(v => `<option value="${esc(v.name)}" ${(v.name === sysPref || (v === Sys.chosen)) ? "selected" : ""}>${esc(v.name)} · ${esc(v.lang)}</option>`).join("")
      : `<option>（无德语语音）</option>`;
    this.els.voiceSystemSel.disabled = !Sys.de.length;
    this.els.voiceSystemSel.onchange = () => {
      DB.set("voiceSystem", this.els.voiceSystemSel.value);
      Sys.pickBest();
      TTS.refreshStatus();
    };

    // 跟读参数
    this.els.repsSel.value = String(DB.get("shadowReps", 3));
    this.els.gapSel.value = String(DB.get("shadowGap", 4));
    this.els.repsSel.onchange = () => DB.set("shadowReps", +this.els.repsSel.value);
    this.els.gapSel.onchange = () => DB.set("shadowGap", +this.els.gapSel.value);

    this.els.progressInfo.textContent = `已掌握 ${Corpus.masteredCount()} / ${Corpus.entries.length}`;

    if (Local.available() && Local.base && location.hostname && location.protocol === "http:") {
      // 局域网入口由 /api/health 提供（lanUrl），仅服务以 --lan 启动时存在
      fetch(Local.base + "/api/health").then(r => r.json()).then(j => {
        if (j && j.lanUrl) { this.els.lanUrl.textContent = j.lanUrl; this.els.lanUrl.hidden = false; }
      }).catch(() => {});
    }
  },

  fatal(msg) {
    const el = this.els.fatal;
    el.hidden = false;
    el.innerHTML = `<strong>页面出错了</strong>（已安全停止，语料与设置不受影响）<br>${esc(msg)}`;
    console.error("[fatal]", msg);
  }
};
</script>
<script>
/* =====================================================================
   app.js · 启动与装配
   流程：加载语料（失败→红框提示并安全停止）
        → 探测本地神经语音服务（不可用则挂 8 秒自动重试监视）
        → 扫描系统德语语音（兜底）
        → 渲染今日跟读，进入可学习状态
   ===================================================================== */

document.addEventListener("DOMContentLoaded", async () => {
  UI.init();

  // 任何一次点击/触摸解锁音频（浏览器自动播放策略）
  ["pointerdown", "touchstart", "keydown"].forEach(ev =>
    document.addEventListener(ev, () => AudioGate.unlock(), { passive: true, capture: true })
  );

  // 页头日期
  document.getElementById("today-date").textContent = new Date().toLocaleDateString("zh-CN", {
    year: "numeric", month: "long", day: "numeric", weekday: "long"
  });

  // 状态灯点击 → 设置
  UI.els.pill.addEventListener("click", () => UI.showView("settings"));

  // 标签页
  UI.els.viewTitles.forEach(btn => btn.addEventListener("click", () => UI.showView(btn.dataset.view)));

  // 语料库搜索与主题筛选
  const searchInput = UI.els.corpusSearch;
  let debounceT = null;
  searchInput.addEventListener("input", () => {
    clearTimeout(debounceT);
    debounceT = setTimeout(() => { UI.corpusQuery = searchInput.value; UI.renderCorpus(); }, 120);
  });
  const topics = [...Corpus.topics().entries()];
  UI.els.topicChips.innerHTML =
    `<button class="chip-btn on" data-topic="全部">全部 ${Corpus.entries.length}</button>` +
    topics.map(([t, n]) => `<button class="chip-btn" data-topic="${esc(t)}">${esc(t)} ${n}</button>`).join("");
  UI.els.topicChips.querySelectorAll(".chip-btn").forEach(btn => btn.addEventListener("click", () => {
    UI.els.topicChips.querySelectorAll(".chip-btn").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    UI.corpusTopic = btn.dataset.topic;
    UI.renderCorpus();
  }));

  // 设置页：重置进度
  UI.els.btnReset.addEventListener("click", () => {
    if (!confirm("确定清空所有「已掌握」标记？（语料内容不受影响）")) return;
    DB.resetProgress();
    UI.els.progressInfo.textContent = `已掌握 ${Corpus.masteredCount()} / ${Corpus.entries.length}`;
    UI.toast("进度已清空", "info");
  });

  // 引擎变化时刷新状态灯（探测成功、设置切换都会走这里）
  TTS.onEngineChange = () => { UI.updateStatus(); };

  /* ---------- 语料 ---------- */
  try {
    await Corpus.load();
  } catch (e) {
    UI.fatal(e.message);
    return;
  }
  document.getElementById("corpus-stat").textContent = `${Corpus.entries.length} 句 A1 语料 · ${Corpus.entries.reduce((s, e) => s + (e.vocab || []).length, 0)} 个生词`;

  /* ---------- 语音引擎 ---------- */
  // 0) 离线语音包（静态托管 / GitHub Pages 版）：没有 audio.json 就静默跳过
  try { await Pack.load(); } catch (e) { /* 无清单就是没有离线包 */ }
  // 1) 本地神经服务（强烈推荐，真实德语男/女声）
  let localOk = false;
  try { localOk = await Local.probe(); } catch (e) { localOk = false; }
  if (!localOk) Local.startWatch();   // 服务以后启动也能自动接上
  // 2) 系统德语语音（兜底）
  try {
    if (window.speechSynthesis) await Sys.scan();
  } catch (e) { /* 无 speechSynthesis 就只剩本地服务一条路 */ }

  UI.updateStatus();
  const st = TTS.status();
  if (!st.ok) {
    UI.toast("⚠️ 没有可用的德语语音：" + (st.reason || "未知原因") + "。点右上角状态灯查看修复方法。", "error");
  } else if (st.kind === "system") {
    UI.toast("ℹ️ 当前使用系统德语语音。双击「启动德语课堂.bat」可获得本地神经语音（更自然，逐词变速更稳）。", "info");
  }

  /* ---------- 视图 ---------- */
  UI.renderDaily();
  UI.renderCorpus();
  UI.showView("daily");

  window.__DK__ = { Corpus, TTS, Local, Sys, Shadow, UI, DB, AudioGate, VERSION: "v2-rebuild" };
  console.log("[deutsch-klasse] 就绪", window.__DK__);
});
</script>
</body>
